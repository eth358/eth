<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="background"></div>
    <div id="overlay"></div> <div id="noise"></div> <audio id="audio" loop></audio>

    <div id="enter-screen">
        <div class="enter-text">click to enter...</div>
    </div>

    <div id="main-card" class="hidden">
        <div class="profile-header">
            <img id="avatar" src="" alt="Avatar">
            <div class="badges" id="badges"></div>
        </div>
        
        <h1 id="username" class="glitch-effect"></h1>
        <p id="typewriter"></p>

        <div id="links" class="links-grid"></div>

        <div class="footer-controls">
            <i class="fa-solid fa-volume-high" id="vol-icon" onclick="toggleMute()"></i>
            <span id="view-count"><i class="fa-solid fa-eye"></i> <span id="views">0</span></span>
        </div>
    </div>

    <div id="cursor"></div>

    <canvas id="canvas"></canvas>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
