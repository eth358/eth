<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Etherac | Secure</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <canvas id="weather-canvas"></canvas>
    
    <!-- Entrance -->
    <div id="entrance" class="overlay">
        <h1 class="glitch">ETHERAC</h1>
        <p>[ CLICK TO BOOT ]</p>
    </div>

    <!-- Auth -->
    <div id="auth-ui" class="overlay hidden">
        <div class="auth-card">
            <h2 id="auth-title">LOGIN</h2>
            <div id="login-box">
                <input type="text" id="l-user" placeholder="USERNAME">
                <input type="password" id="l-pass" placeholder="PASSWORD">
                <button onclick="auth.login()">ACCESS</button>
                <p onclick="ui.toggleAuth('reg')">Register with Invite</p>
            </div>
            <div id="reg-box" class="hidden">
                <input type="text" id="r-inv" placeholder="INVITE CODE">
                <input type="text" id="r-user" placeholder="USERNAME">
                <input type="password" id="r-pass" placeholder="PASSWORD">
                <button onclick="auth.register()">CREATE ACCOUNT</button>
                <p onclick="ui.toggleAuth('login')">Back to Login</p>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <main id="app" class="hidden">
        <div class="main-layout">
            <!-- Profile Card -->
            <div class="glass-card" id="profile-card">
                <div class="profile-header">
                    <img id="p-img" src="https://ui-avatars.com/api/?name=Etherac">
                    <h1 id="p-name">USER</h1>
                    <p id="p-role">MEMBER</p>
                </div>
                
                <div class="profile-editor hidden" id="editor">
                    <input type="text" id="edit-img" placeholder="AVATAR URL">
                    <input type="text" id="edit-role" placeholder="CUSTOM ROLE">
                    <button onclick="profile.save()">SAVE CHANGES</button>
                </div>

                <div class="controls">
                    <button onclick="ui.toggleEditor()">CUSTOMIZE PROFILE</button>
                    <button onclick="auth.logout()" class="red">DISCONNECT</button>
                </div>
            </div>

            <!-- Admin Card -->
            <div class="glass-card admin-only hidden" id="admin-card">
                <h3>ADMIN PANEL</h3>
                <div id="invite-area">
                    <p>ACTIVE INVITES:</p>
                    <ul id="invite-list"></ul>
                    <button onclick="auth.genInvite()">GENERATE NEW CODE</button>
                </div>
            </div>
        </div>
    </main>

    <audio id="bg-music" loop></audio>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
