<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@Etherac | Bio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Arka Plan Görseli/GIF -->
    <div id="bg-media"></div>
    <div class="overlay-scanlines"></div>
    <div class="overlay-vignette"></div>

    <!-- Müzik -->
    <audio id="bg-audio" loop></audio>

    <!-- Giriş Ekranı -->
    <div id="enter-screen">
        <div class="enter-content">
            <p class="click-text">[ GİRİŞ YAPMAK İÇİN TIKLA ]</p>
        </div>
    </div>

    <!-- Ana Kart -->
    <main class="container" id="main-container">
        <div class="profile-card">
            <div class="avatar-wrapper">
                <img src="" alt="Avatar" id="user-avatar">
                <div class="rank-badge"><i class="fa-solid fa-crown"></i></div>
            </div>

            <h1 id="username" class="glitch" data-text=""></h1>
            
            <div class="typewriter-container">
                <span id="typewriter"></span><span class="cursor">|</span>
            </div>

            <div class="links-container" id="links-box">
                <!-- Linkler JS ile buraya gelecek -->
            </div>
            
            <div class="volume-control">
                <i class="fa-solid fa-volume-high" id="mute-btn"></i>
            </div>
            
            <div class="footer">ETHERAC SYSTEM v2.0</div>
        </div>
    </main>

    <!-- Özel İmleç -->
    <div id="cursor-dot"></div>
    <div id="cursor-circle"></div>

    <script src="script.js"></script>
</body>
</html>
