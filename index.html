<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUWAII.TEAM | kuwaii.team</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --red: #ff0000;
            --white: #ffffff;
            --bg-deep: #050505;
            --nav-bg: rgba(8, 8, 12, 0.98);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; cursor: none; }
        body { background: var(--bg-deep); color: var(--white); overflow: hidden; }

        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        #intro-canvas { z-index: 10001; pointer-events: none; opacity: 0.8; }
        #matrix-canvas { z-index: 0; opacity: 0.3; }

        /* --- INTRO & SNAKE EFFECT --- */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 10000; transition: opacity 1.2s ease;
        }

        .intro-bpm {
            font-family: 'Orbitron'; font-size: 5.5rem; font-weight: 900;
            letter-spacing: 12px;
            background: linear-gradient(90deg, #300 0%, var(--red) 25%, #fff 50%, var(--red) 75%, #300 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: snakeMove 2s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes snakeMove { to { background-position: 200% center; } }

        /* --- BORDER SLIDE ENTER BUTTON --- */
        #enter-btn {
            opacity: 0;
            visibility: hidden;
            margin-top: 40px;
            padding: 15px 45px;
            font-family: 'Orbitron';
            font-size: 1rem;
            font-weight: 800;
            color: var(--white);
            background: transparent;
            border: 2px solid var(--red);
            position: relative;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.5s ease;
            letter-spacing: 3px;
        }

        #enter-btn.visible {
            opacity: 1;
            visibility: visible;
            animation: fadeInUp 1s ease forwards;
            box-shadow: 0 0 15px var(--red);
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Slide Effect on Hover */
        #enter-btn::before {
            content: '';
            position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: var(--red);
            transition: 0.4s;
            z-index: -1;
        }
        #enter-btn:hover::before { left: 0; }
        #enter-btn:hover { color: #000; text-shadow: none; box-shadow: 0 0 30px var(--red); }

        .click-anywhere {
            color: #444; font-size: 0.7rem; letter-spacing: 2px;
            animation: pulseText 1.5s infinite;
        }
        @keyframes pulseText { 50% { opacity: 0.3; } }

        /* --- UI ELEMENTS --- */
        nav {
            position: fixed; top: 0; width: 100%; height: 80px;
            background: var(--nav-bg); display: flex; align-items: center;
            justify-content: space-between; padding: 0 5%; z-index: 1000;
            border-bottom: 1px solid rgba(255, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }
        .nav-logo { font-family: 'Orbitron'; font-weight: 900; color: #fff; font-size: 1.8rem; }
        .nav-logo span { color: var(--red); }
        .nav-links { display: flex; gap: 30px; list-style: none; }
        .nav-links a { text-decoration: none; color: #666; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #fff; text-shadow: 0 0 10px var(--red); }

        .view { display: none; padding-top: 120px; min-height: 100vh; position: relative; }
        .view.active { display: block; animation: viewFade 0.8s ease; }
        @keyframes viewFade { from { opacity: 0; } to { opacity: 1; } }

        .hero-section {
            height: 70vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center;
        }
        .hero-logo { font-family: 'Orbitron'; font-size: 7rem; font-weight: 900; color: #fff; text-shadow: 0 0 50px var(--red); }

        #custom-cursor { position: fixed; pointer-events: none; z-index: 99999; border-radius: 50%; width: 10px; height: 10px; background: var(--red); box-shadow: 0 0 15px var(--red); transform: translate(-50%, -50%); }
    </style>
</head>
<body onclick="startHeartbeat()">

    <!-- Intro Layer -->
    <div id="intro-overlay">
        <canvas id="intro-canvas"></canvas>
        <div class="intro-bpm">KUWAII.BPM</div>
        <div class="click-anywhere" id="click-hint">CLICK ANYWHERE TO SYNC HEARTBEAT</div>
        <button id="enter-btn" onclick="enterSite(event)">SLIDE US</button>
    </div>

    <!-- Background Layers -->
    <canvas id="matrix-canvas"></canvas>
    <canvas id="trail-canvas"></canvas>

    <nav>
        <div class="nav-logo">KUWAII<span>.TEAM</span></div>
        <ul class="nav-links">
            <li><a href="#" class="active" onclick="setView('home', this)">HOME</a></li>
            <li><a href="#" onclick="setView('status', this)">STATUS</a></li>
            <li><a href="#" onclick="setView('purchase', this)">PURCHASE</a></li>
            <li><a href="#" onclick="setView('tutorial', this)">TUTORIAL</a></li>
        </ul>
        <div class="nav-right">
            <a href="https://discord.gg/ufYTRUY2PH" style="border:1px solid var(--red); padding:10px 25px; border-radius:50px; color:#fff; text-decoration:none; font-size:0.75rem;">SUPPORT</a>
        </div>
    </nav>

    <!-- HOME VIEW -->
    <div id="home" class="view active">
        <section class="hero-section">
            <h1 class="hero-logo">KUWAII.TEAM</h1>
            <p style="font-size: 1.8rem;">Feel the <span style="color:var(--red); font-weight:900;">adrenaline</span>, own the game</p>
            <div style="display:flex; gap:80px; margin-top:80px;">
                <div style="text-align:center;"><h4>ETH</h4><span style="color:var(--red); font-size:0.7rem; font-weight:800;">ARCHITECT</span></div>
                <div style="text-align:center;"><h4>DEIZZY</h4><span style="color:var(--red); font-size:0.7rem; font-weight:800;">OPERATIONS</span></div>
            </div>
        </section>
    </div>

    <!-- Other views (Purchase, Status vb.) önceki kodla aynı kalacak şekilde sistemdedir -->

    <div id="custom-cursor"></div>

    <script>
        // --- Matrix Engine (DEIZZY: RED, ETH: WHITE) ---
        const mCanvas = document.getElementById('matrix-canvas');
        const mctx = mCanvas.getContext('2d');
        mCanvas.width = window.innerWidth; mCanvas.height = window.innerHeight;
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        const specialNames = ["DEIZZY", "ETH"];
        const fontSize = 16;
        const columns = mCanvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            mctx.fillStyle = "rgba(5, 5, 5, 0.1)";
            mctx.fillRect(0, 0, mCanvas.width, mCanvas.height);
            mctx.font = fontSize + "px Orbitron";

            for(let i=0; i<drops.length; i++) {
                let text = chars[Math.floor(Math.random()*chars.length)];
                let isSpecial = false;
                if(Math.random() > 0.99) { text = specialNames[Math.floor(Math.random()*specialNames.length)]; isSpecial = true; }

                if(isSpecial) {
                    mctx.shadowBlur = 15;
                    mctx.fillStyle = (text === "DEIZZY") ? "#ff0000" : "#ffffff";
                    mctx.shadowColor = mctx.fillStyle;
                } else {
                    mctx.shadowBlur = 0; mctx.fillStyle = Math.random() > 0.5 ? "#200" : "#050505";
                }

                mctx.fillText(text, i*fontSize, drops[i]*fontSize);
                if(drops[i]*fontSize > mCanvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
            requestAnimationFrame(drawMatrix);
        }
        drawMatrix();

        // --- DNA Intro Animation ---
        const iCanvas = document.getElementById('intro-canvas');
        const ictx = iCanvas.getContext('2d');
        iCanvas.width = window.innerWidth; iCanvas.height = window.innerHeight;

        function drawDNA() {
            ictx.clearRect(0,0,iCanvas.width, iCanvas.height);
            const t = Date.now() * 0.002;
            for(let i=0; i<iCanvas.height; i+=25) {
                const x = Math.sin(i*0.01 + t) * 150 + iCanvas.width/2;
                const x2 = Math.sin(i*0.01 + t + Math.PI) * 150 + iCanvas.width/2;
                ictx.fillStyle = 'red'; ictx.beginPath(); ictx.arc(x, i, 4, 0, Math.PI*2); ictx.fill();
                ictx.fillStyle = 'white'; ictx.beginPath(); ictx.arc(x2, i, 4, 0, Math.PI*2); ictx.fill();
                ictx.strokeStyle = 'rgba(255,0,0,0.1)'; ictx.beginPath(); ictx.moveTo(x, i); ictx.lineTo(x2, i); ictx.stroke();
            }
            if(document.getElementById('intro-overlay').style.display !== 'none') requestAnimationFrame(drawDNA);
        }
        drawDNA();

        // --- Heartbeat Audio Logic ---
        let audioCtx;
        let hbInterval;
        let isHeartbeatStarted = false;

        function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

        function playHeart() {
            if(!audioCtx) return;
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'sine'; o.frequency.setValueAtTime(50, audioCtx.currentTime);
            g.gain.setValueAtTime(0.7, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + 0.15);
        }

        function startHeartbeat() {
            if(isHeartbeatStarted) return;
            initAudio();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            playHeart();
            hbInterval = setInterval(playHeart, 900); // Ağır ve derin tempo
            isHeartbeatStarted = true;

            // Butonu göster, ipucunu gizle
            document.getElementById('enter-btn').classList.add('visible');
            document.getElementById('click-hint').style.display = 'none';
        }

        function enterSite(e) {
            e.stopPropagation(); // Parent body click'i tetiklemesin
            clearInterval(hbInterval); // Sesi kes
            document.getElementById('intro-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('intro-overlay').style.display = 'none';
                document.body.style.overflow = 'auto';
            }, 1200);
        }

        // --- Mouse Trail ---
        const tCanvas = document.getElementById('trail-canvas');
        const tctx = tCanvas.getContext('2d');
        tCanvas.width = window.innerWidth; tCanvas.height = window.innerHeight;
        let trail = [];

        window.addEventListener('mousemove', (e) => {
            document.getElementById('custom-cursor').style.left = e.x + 'px';
            document.getElementById('custom-cursor').style.top = e.y + 'px';
            for(let i=0; i<3; i++) trail.push({x: e.x, y: e.y, a: 1, vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3});
        });

        function animateTrail() {
            tctx.clearRect(0,0,tCanvas.width, tCanvas.height);
            for(let i=0; i<trail.length; i++) {
                let p = trail[i]; p.x += p.vx; p.y += p.vy; p.a -= 0.02;
                if(p.a <= 0) { trail.splice(i,1); i--; continue; }
                tctx.fillStyle = `rgba(255,0,0,${p.a})`;
                tctx.beginPath(); tctx.arc(p.x, p.y, 2.5, 0, Math.PI*2); tctx.fill();
            }
            requestAnimationFrame(animateTrail);
        }
        animateTrail();

        function setView(id, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            el.classList.add('active');
        }
    </script>
</body>
</html>
